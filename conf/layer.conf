# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "ark-meta-simaai"
BBFILE_PATTERN_ark-meta-simaai = "^${LAYERDIR}/"
BBFILE_PRIORITY_ark-meta-simaai = "8"

# Depends on SiMa vendor layer (modalix machines, kernel, u-boot, images)
LAYERDEPENDS_ark-meta-simaai = "core meta-simaai"
LAYERSERIES_COMPAT_ark-meta-simaai = "scarthgap"

# Shared regex for ARK Modalix carrier machines (used by bbappends)
ARK_SIMAAI_MACHINES = "ark-jaj|ark-pab|ark-pab-v3|ark-can-pab"
